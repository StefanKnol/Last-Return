image:
  # The registry host is not written down in this repository, so it is given at install time:
  #   --set image.repository=<registry-host>/last-return
  repository: ""
  # `latest` moves, and Helm cannot see it move: an upgrade with nothing else changed restarts
  # nothing. Pin a build for a real deploy: --set image.tag=build-92
  tag: latest
  # Always, so that a pod restarted on `latest` picks up the newest push.
  pullPolicy: Always

# Only needed if the registry stops serving pulls anonymously.
imagePullSecrets: []

# One, and no more while lobbies are on: a lobby lives in the memory of the pod that opened it, and a player sent
# to another pod would find no lobby there. (The chart refuses more.) Every deploy starts a new pod, and with
# the old one go the lobbies that were open in it: whoever was down there together plays on alone.
replicaCount: 1

# "Descend together" on the title screen: players open a lobby, hand each other its five-character code, and go down
# into the same station. The server only passes on what their browsers say to each other. Off, the game is
# served to be played alone and the title screen does not mention it.
lobbies:
  enabled: true
  # How many proxies stand between the browsers and the pod, so that the server knows whose address is whose
  # when it limits how often one address may guess at lobby codes. Left empty: 1 with the ingress on (the
  # ingress controller), 0 without. Set it to 2 if something else is in front of the ingress as well (a CDN).
  proxies:

# What this server calls itself in the bug reports filed from the game: with "Official server", a report's
# "How you played" reads "Official server · Online at <host>/". Empty, it gives the address alone.
# Letters, digits, spaces, dots, underscores and hyphens, 40 at most.
serverName: ""

service:
  # ClusterIP when an ingress controller fronts the game.
  # LoadBalancer to get a public address without one (plain http on port 80).
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  # The cluster has to have an ingress controller, and this names its class.
  className: traefik
  host: ""
  # The cert-manager ClusterIssuer that gets the certificate (cluster/letsencrypt-issuer.yaml
  # creates one named `letsencrypt`). Set, it turns https on and the certificate is kept in
  # the secret <release>-tls. Empty means plain http, unless tlsSecretName is given.
  clusterIssuer: ""
  # Only to bring your own certificate, or to name the secret differently.
  tlsSecretName: ""
  annotations: {}

# One 3 MB page held in memory, and a Node process that passes short messages along.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 192Mi
